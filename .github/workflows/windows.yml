name: Windows
on:
  push:
    branches: [windows-port]
    tags: ['windows-v*']
    paths: ['windows/**', 'README.md', 'docs/project-format.md', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'README.md', 'docs/project-format.md', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check release documentation
        run: ./windows/scripts/check-docs.ps1
      - name: Build with warnings as errors
        run: dotnet build windows/Compositor.slnx -c Release -warnaserror --nologo
      - name: Core, Chinese text and ONNX tests
        env:
          COMPOSITOR_SPIKE: '1'
        run: dotnet test windows/tests/Compositor.Core.Tests -c Release --no-build --logger 'trx;LogFileName=core.trx' --results-directory artifacts/tests
      - name: Synthetic performance and allocation gates
        run: ./windows/scripts/performance-checks.ps1
      - name: Two-core scalar and 512 MiB compatibility gates
        run: ./windows/scripts/compatibility-checks.ps1 -SkipBuild -Scalar -Output artifacts/compatibility
      - name: Drive the editor and dialogs in both languages
        run: |
          New-Item -ItemType Directory artifacts/screenshots -Force | Out-Null
          $env:COMPOSITOR_LANGUAGE = 'en'
          $env:COMPOSITOR_SETTINGS_DIR = Join-Path $env:RUNNER_TEMP 'compositor-en-tests'
          foreach ($check in @('clicks', 'tabs', 'tools', 'shortcuts', 'camera-raw', 'dialogs', 'windows-checks', 'interaction-checks', 'panel-checks', 'inspector-checks', 'workspace-checks', 'layer-style-checks', 'editing-checks', 'professional-checks', 'image-workspace-checks', 'edit-workspace-checks', 'preferences-checks', 'type-mask-checks', 'docking-checks', 'chrome-checks', 'selection-options-checks', 'panel-workflow-checks', 'pen-layer-checks', 'utility-retouch-checks')) {
            dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll "--$check" "artifacts/screenshots/$check.png"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:COMPOSITOR_LANGUAGE = 'zh-CN'
          $env:COMPOSITOR_SETTINGS_DIR = Join-Path $env:RUNNER_TEMP 'compositor-zh-tests'
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --windows-checks artifacts/screenshots/chinese-editor.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --interaction-checks artifacts/screenshots/chinese-interaction.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --panel-checks artifacts/screenshots/chinese-panels.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --inspector-checks artifacts/screenshots/chinese-inspector.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --workspace-checks artifacts/screenshots/chinese-workspace.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --layer-style-checks artifacts/screenshots/chinese-layer-style.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --editing-checks artifacts/screenshots/chinese-editing.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --professional-checks artifacts/screenshots/chinese-professional.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --image-workspace-checks artifacts/screenshots/chinese-image-workspace.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --edit-workspace-checks artifacts/screenshots/chinese-edit-workspace.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --preferences-checks artifacts/screenshots/chinese-preferences.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --type-mask-checks artifacts/screenshots/chinese-type-mask.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --docking-checks artifacts/screenshots/chinese-docking.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --chrome-checks artifacts/screenshots/chinese-chrome.png
          if ($LASTEXITCODE -ne 0) { throw 'Chinese chrome checks failed' }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --selection-options-checks artifacts/screenshots/chinese-selection-options.png
          if ($LASTEXITCODE -ne 0) { throw 'Chinese selection options checks failed' }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --panel-workflow-checks artifacts/screenshots/chinese-panel-workflow.png
          if ($LASTEXITCODE -ne 0) { throw 'Chinese panel workflow checks failed' }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --pen-layer-checks artifacts/screenshots/chinese-pen-layer.png
          if ($LASTEXITCODE -ne 0) { throw 'Chinese pen/layer checks failed' }
          dotnet windows/src/Compositor.Desktop/bin/Release/net10.0/Compositor.dll --utility-retouch-checks artifacts/screenshots/chinese-utility-retouch.png
          if ($LASTEXITCODE -ne 0) { throw 'Chinese utility/retouch checks failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: artifacts
  package:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable and installer
        shell: pwsh
        run: ./windows/scripts/package.ps1 -OutputDirectory "$PWD/artifacts" -Installer
      - name: Test published app, installer and uninstaller
        shell: pwsh
        run: |
          $env:COMPOSITOR_LANGUAGE = 'zh-CN'
          $env:COMPOSITOR_SETTINGS_DIR = Join-Path $env:RUNNER_TEMP 'compositor-package-tests'
          $app = Resolve-Path artifacts/Compositor-Windows-*-x64/Compositor.exe
          $process = Start-Process -FilePath $app -ArgumentList @('--windows-checks', "$env:RUNNER_TEMP/published.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published app failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--interaction-checks', "$env:RUNNER_TEMP/published-interaction.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published interaction checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--panel-checks', "$env:RUNNER_TEMP/published-panels.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published panel checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--inspector-checks', "$env:RUNNER_TEMP/published-inspector.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published inspector checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--workspace-checks', "$env:RUNNER_TEMP/published-workspace.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published workspace checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--layer-style-checks', "$env:RUNNER_TEMP/published-layer-style.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published layer style checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--editing-checks', "$env:RUNNER_TEMP/published-editing.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published editing checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--professional-checks', "$env:RUNNER_TEMP/published-professional.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published professional checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--image-workspace-checks', "$env:RUNNER_TEMP/published-image-workspace.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published image workspace checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--edit-workspace-checks', "$env:RUNNER_TEMP/published-edit-workspace.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published edit workspace checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--preferences-checks', "$env:RUNNER_TEMP/published-preferences.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published preferences checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--type-mask-checks', "$env:RUNNER_TEMP/published-type-mask.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published type/mask checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--docking-checks', "$env:RUNNER_TEMP/published-docking.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published docking checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--chrome-checks', "$env:RUNNER_TEMP/published-chrome.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published chrome checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--selection-options-checks', "$env:RUNNER_TEMP/published-selection-options.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published selection options checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--panel-workflow-checks', "$env:RUNNER_TEMP/published-panel-workflow.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published panel workflow checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--pen-layer-checks', "$env:RUNNER_TEMP/published-pen-layer.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published pen/layer checks failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath $app -ArgumentList @('--utility-retouch-checks', "$env:RUNNER_TEMP/published-utility-retouch.png") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published utility/retouch checks failed: $($process.ExitCode)" }
          $installer = Get-Item artifacts/*-setup.exe
          $destination = Join-Path $env:RUNNER_TEMP 'Compositor-Install-Test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$destination") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin 0,3010) { throw "Install failed: $($process.ExitCode)" }
          if (!(Test-Path "$destination/Compositor.exe")) { throw 'Application missing after install.' }
          $process = Start-Process -FilePath "$destination/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows-x64
          path: |
            artifacts/*-portable.zip
            artifacts/*-setup.exe
            artifacts/SHA256SUMS.txt
          compression-level: 0
